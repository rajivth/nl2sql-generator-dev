spring.application.name=nl2sql-generator

## Data source connection ###
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
########## disabled for below properties pgsql<=>  ##############
spring.data.jpa.repositories.query.native.parser=regex

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


##Ollma config
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.1:8b
spring.ai.ollama.chat.options.temperature=0
#spring.ai.ollama.chat.options.additional-model-request.think=false
# JSON format is set per structured-output call so SQL generate can return raw SQL
###Vector store config#############
spring.ai.ollama.embedding.options.model=nomic-embed-text

#pg vector config###
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

#####LOG enable#####
logging.level.com.nl2sql.generator=DEBUG
logging.level.org.stringtemplate=DEBUG
logging.level.org.springframework.ai.template.st=DEBUG
logging.level.com.nl2sql=DEBUG
